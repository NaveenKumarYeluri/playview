name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/PlayView/PlayView.csproj

      - name: Build
        run: dotnet build src/PlayView/PlayView.csproj -c Release --no-restore

      - name: Publish (portable, self-contained)
        run: dotnet publish src/PlayView/PlayView.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Flatten native runtime libs (if any)
        shell: pwsh
        run: |
          if (Test-Path "publish/runtimes/win-x64/native") {
            Copy-Item "publish/runtimes/win-x64/native/*" "publish/" -Force
            Remove-Item "publish/runtimes" -Recurse -Force
          }
          if (Test-Path "publish/libvlc/win-x86") {
            Remove-Item "publish/libvlc/win-x86" -Recurse -Force
          }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "publish/*" -DestinationPath "PlayView-win-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayView-win-x64
          path: PlayView-win-x64.zip

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner already ships the Android SDK — just accept licenses so the
      # build can auto-install any missing platform/build-tools packages.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Fixed signing key: restore from cache, or generate once. The generated
      # keystore is then committed to the repo, making it permanent.
      - name: Restore signing keystore
        id: keystore
        uses: actions/cache@v4
        with:
          path: android/keystore.jks
          key: playview-signing-v1

      - name: Generate signing keystore (first time only)
        id: genkey
        if: steps.keystore.outputs.cache-hit != 'true' && !hashFiles('android/keystore.jks')
        run: |
          keytool -genkeypair -v \
            -keystore android/keystore.jks \
            -storepass playview -keypass playview \
            -alias playview -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=PlayView Stream"
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Commit the keystore so future builds reuse it
        if: always() && steps.genkey.outputs.generated == 'true'
        run: |
          git config user.name "playview-ci"
          git config user.email "playview-ci@users.noreply.github.com"
          git add android/keystore.jks
          if ! git diff --cached --quiet; then
            git commit -m "Add permanent APK signing keystore (generated once in CI)"
            git push origin HEAD:main
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayView-Streamer-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
